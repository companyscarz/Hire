name: Hire Cloud tests

on:
  push:
    branches: [pre-main]
    paths:
      - "nixpacks.toml"
      - "requirements.txt"
      - "app/hire_cloud/**"
      - "app/migrations/**"
      - "app/tests/**"
      - "app/cloud_requirements.txt"
      - ".github/workflows/hire-cloud-tests.yml"
  pull_request:
    branches: [main, pre-main]
    paths:
      - "nixpacks.toml"
      - "requirements.txt"
      - "app/hire_cloud/**"
      - "app/migrations/**"
      - "app/tests/**"
      - "app/cloud_requirements.txt"
      - ".github/workflows/hire-cloud-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/cloud_requirements.txt
      - name: Install Hire Cloud dependencies
        run: python -m pip install -r cloud_requirements.txt
      - name: Validate Nixpacks deployment configuration
        run: python -c "import tomllib; p=tomllib.load(open('../nixpacks.toml', 'rb')); assert p['providers'] == ['python']; assert 'gunicorn' in p['start']['cmd']; print('Nixpacks configuration OK')"
      - name: Apply checked-in migration against disposable SQLite
        run: flask --app 'hire_cloud:create_app()' db upgrade --directory migrations
      - name: Check models match the checked-in migration
        run: flask --app 'hire_cloud:create_app()' db check --directory migrations
      - name: Run all Hire Cloud tests
        run: python -m pytest -q tests/
