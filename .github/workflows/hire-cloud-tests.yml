name: Hire Cloud tests

on:
  push:
    branches: [pre-main]
    paths:
      - "nixpacks.toml"
      - "requirements.txt"
      - "app/hire_cloud/**"
      - "app/migrations/**"
      - "app/tests/**"
      - "app/cloud_requirements.txt"
      - ".github/workflows/hire-cloud-tests.yml"
  pull_request:
    branches: [main, pre-main]
    paths:
      - "nixpacks.toml"
      - "requirements.txt"
      - "app/hire_cloud/**"
      - "app/migrations/**"
      - "app/tests/**"
      - "app/cloud_requirements.txt"
      - ".github/workflows/hire-cloud-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: testing
      SECRET_KEY: ci-only-secret-not-for-production
      DATABASE_URL: postgresql+psycopg://hire_cloud:hire_cloud_test_password@localhost:5432/hire_cloud_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hire_cloud
          POSTGRES_PASSWORD: hire_cloud_test_password
          POSTGRES_DB: hire_cloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hire_cloud -d hire_cloud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/cloud_requirements.txt
      - name: Install Hire Cloud dependencies
        run: python -m pip install -r cloud_requirements.txt
      - name: Validate Nixpacks deployment configuration
        run: python -c "import tomllib; p=tomllib.load(open('../nixpacks.toml', 'rb')); assert p['providers'] == ['python']; assert 'gunicorn' in p['start']['cmd']; print('Nixpacks configuration OK')"
      - name: Apply checked-in migration against disposable PostgreSQL
        run: flask --app 'hire_cloud:create_app()' db upgrade --directory migrations
      - name: Check models match the checked-in migration
        run: flask --app 'hire_cloud:create_app()' db check --directory migrations
      - name: Run all Hire Cloud tests
        run: python -m pytest -q tests/
