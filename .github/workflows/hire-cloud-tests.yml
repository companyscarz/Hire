name: Hire Cloud tests

on:
  push:
    branches: [pre-main]
    paths:
      - "nixpacks.toml"
      - "app/hire_cloud/**"
      - "app/tests/**"
      - "app/cloud_requirements.txt"
      - ".github/workflows/hire-cloud-tests.yml"
  pull_request:
    branches: [main, pre-main]
    paths:
      - "nixpacks.toml"
      - "app/hire_cloud/**"
      - "app/tests/**"
      - "app/cloud_requirements.txt"
      - ".github/workflows/hire-cloud-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/cloud_requirements.txt
      - name: Install Hire Cloud dependencies
        run: python -m pip install -r cloud_requirements.txt
      - name: Generate initial migration preview using disposable SQLite
        run: |
          flask --app 'hire_cloud:create_app()' db init --directory /tmp/hire-cloud-migrations
          flask --app 'hire_cloud:create_app()' db migrate --directory /tmp/hire-cloud-migrations -m "initial hire cloud schema"
          echo "=== MIGRATION REVISION ==="
          cat /tmp/hire-cloud-migrations/versions/*.py
          echo "=== MIGRATION ENVIRONMENT ==="
          cat /tmp/hire-cloud-migrations/env.py
          echo "=== MIGRATION TEMPLATE ==="
          cat /tmp/hire-cloud-migrations/script.py.mako
      - name: Run all Hire Cloud tests
        run: python -m pytest -q tests/
