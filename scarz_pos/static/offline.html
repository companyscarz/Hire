<style>

</head>
<body><main class="card"><div class="mark" aria-hidden="true">H</div><h1>You're offline</h1><p class="muted">Hire POS needs a connection to load your live sales, inventory, and reports. Your private business pages are not stored for offline access.</p><button type="button" onclick="location.reload()">Try again</button></main></body>
