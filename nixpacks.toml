providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12"

[start]
# Bootstrap tables and apply the safe additive barcode schema update before Gunicorn.
cmd = "flask --app 'scarz_pos:create_app()' init-db && gunicorn --bind 0.0.0.0:${PORT:-8000} 'scarz_pos:create_app()' --workers ${WEB_CONCURRENCY:-2} --timeout 60"
