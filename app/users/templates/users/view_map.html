{% extends 'layout.html' %}
{% block head %}
    <title>{{title}}</title>
    <style>
        #map-container {
           height: 500px; /* Adjust as needed to fit within the viewport */
            width: 100%; /* Adjust the width of the map container */
            margin: 10px auto; /* Center the map horizontally */
            border-radius: 2%; /* Set border radius for smooth edges */
            overflow: hidden; /* Hide overflow content */
        }
    </style>
{% endblock head %}

{% block body %}
<div>
    <nav class="container navbar">
		<ul class="nav nav-pills">
	  		<li class="nav-item">
		 		<a class="nav-link" aria-current="page" href="{{url_for('welcome_bp.Welcome') }}">
					<b>
						<img height=30px width=30px class="img-fluid rounded" src="{{url_for('static', filename='images/hire_logo.png')}}">
					</b>
				</a>
	  		</li>
		  	<li class="nav-item">
			 	<a class="nav-link" aria-current="page" href="{{ url_for('company_bp.Company') }}">Company</a>
		  	</li>
		  	<li class="nav-item">
			 	<a class="nav-link" aria-current="page" href="{{ url_for('applicant_bp.Applicant') }}">Applicant</a>
		  	</li>
		  	<li class="nav-item">
			 	<a class="nav-link" aria-current="page"  href="{{ url_for('applications_bp.Applications') }}">Applications</a>
		  	</li>
		  	<li class="nav-item">
			 	<a class="nav-link" aria-current="page" href="{{ url_for('opportunities_bp.Opportunities') }}">Opportunities</a>
		  	</li>
		  	<li class="nav-item">
			 	<a class="nav-link" aria-current="page" href="{{ url_for('advertisement_bp.Advertisement') }}">Advertise</a>
		  	</li>
		  	<li class="nav-item">
			 	<a class="nav-link active" aria-current="page" href="{{ url_for('view_map_bp.View_map') }}">
                    <img height=30px width=30px class="img-fluid rounded" src="{{url_for('static', filename='images/hire_pin.png')}}">    
                </a>
		  	</li>	 	 	 
		</ul>
    </nav>

    <div class='flashed container'>
		{% for message in get_flashed_messages() %}
		<div class="alert flash_info alert-dismissible fade show" role="alert">
			<p class="typing-animation">
				{{message}}
			</p>
	  	<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close">
		</button>
		</div>	
		{% endfor %}
	</div>

    <div class="container maps">
        <div class="row justify-content-center">
            <div id="map-container" class="col-md-12">
                {{ map_html|safe }}
            </div>
        </div>
    </div>
</div>

{% endblock body %}
