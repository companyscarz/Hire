<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<link class="img-fluid rounded" alt="Hire-logo" rel="shortcut icon" type="image/x-icon" href="{{url_for('static', filename='images/favicon.ico')}}">
    <link href="{{url_for('static', filename='css/main.css')}}" rel="stylesheet">

  {%block head%}
  {%endblock head%}
  </head>

  <body class="container">
	  
	  <div class="col-md-12 fw-light">
		  {% block body %}
		  {% endblock body%}
		  <center>
			  <a href="{{url_for('about_bp.About')}}">
				  <b>
					  <img alt="Hire logo" height=40px width=40px class="img-fluid rounded" src="{{url_for('static', filename='images/hire_logo.png')}}">
				  </b>
			  </a>
		  </center>
	  </div>

		<div id="blur-overlay"></div><!-- for preventing screenshots-->
	  
		<hr>
    
	  <script src="{{url_for('static', filename='javascript/script.js')}}"></script>
	  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
	      <!-- Bootstrap JS CDN (optional, only if you need JavaScript features) -->
      <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
      <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
      <!-- Carousel script for automatic sliding -->
      <script>
          $('.carousel').carousel({
              interval: 5000, // Change slide interval (in milliseconds)
              pause: 'hover' // Pause slide on hover
          });
      </script>
	  
		<!--preventing screen recording-->
	  <script>
	    const blurOverlay = document.getElementById('blur-overlay');
	
	    // Blur the screen when the window loses focus
	    window.addEventListener('blur', () => {
	        blurOverlay.style.visibility = 'visible';
	    });
	
	    // Remove the blur when the window gains focus again
	    window.addEventListener('focus', () => {
	        blurOverlay.style.visibility = 'hidden';
	    });
	
	    // Optional: Blur when the user tries to copy content
	    document.addEventListener('copy', (event) => {
	        blurOverlay.style.visibility = 'visible';
	        setTimeout(() => {
	            blurOverlay.style.visibility = 'hidden';
	        }, 1000);  // Blur for 1 second
	    });

		// Disable right-click
		document.addEventListener('contextmenu', event => event.preventDefault());
		
		// Detect F12 (Developer Tools)
		document.addEventListener('keydown', (event) => {
		    if (event.key === "F12" || (event.ctrlKey && event.shiftKey && event.key === "I")) {
		        alert("Developer tools are disabled on this site.");
		        event.preventDefault();
		    }
		});
	</script>
	  
  </body>
	<footer>
		{% block footer %} {% endblock footer %}
	</footer>
	
</html>
