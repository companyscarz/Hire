<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<link rel="shortcut icon" type="image/x-icon" href="{{url_for('static', filename='images/favicon.ico')}}">
    <link href="{{url_for('static', filename='css/main.css')}}" rel="stylesheet" >

  {%block head%}
  {%endblock head%}
  </head>
  
  <body class="container">
	  <!--<span><center>Worldly Opportunities</center></span>-->
	  
	<hr>
	<div class="col-md-12">
    <div class="container">
        <span><b><i><h1>!</h1></i></b></span>
        <div class="error-container container">
            <h1><center><b>😔</b></center></h1>
            <h3><center>
				{% block errortype %} {% endblock errortype %}
			</center></h3>
            <p>
				<center>Error,{% block errormsg %}{% endblock errormsg %}!</center>
			</p>
            <p>Return to <a href="{{url_for('welcome_bp.Welcome')}}"><b>home</b></a>.</p>
        </div>
    </div>
	<center>
		<a href="{{url_for('about_bp.About')}}">
			<b>
				<img height=30px width=30px class="img-fluid rounded" src="{{url_for('static', filename='images/hire_logo.png')}}">
			</b>
		</a>
	</center>
	<hr>
	<br>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
	<footer>
		{% block footer %} {% endblock footer %}
	</footer>
</html>
